[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-sast-wrapper"
version = "0.1.0"
description = "Runs Semgrep/Bandit and produces a ranked report grouped by OWASP Top 10 category and severity."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "bandit>=1.7"]

[project.scripts]
sast-wrapper = "sast_wrapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]